name: forge_ui
description: Shared tkforgeworks brand theme and generic screens for Flutter apps.
version: 0.1.0-rc.1+2
repository: https://github.com/tkforgeworks/forge-ui
# Consumed as a git dependency pinned to a release tag, not from pub.dev.
publish_to: none

# The floor is the oldest toolchain a consuming app pins, not the one this
# repo develops on: an app cannot resolve the package below it.
environment:
  sdk: ^3.13.2
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter
  heroicons: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # The OFL texts, loaded by `registerForgeFontLicenses()` so they show on
  # each app's licences page.
  assets:
    - assets/fonts/licenses/

  # Bundled brand fonts (see assets/fonts/LICENSES.md): static instances so
  # FontWeight selects the face directly; no google_fonts runtime fetch.
  # Apps get them through the dependency, as `packages/forge_ui/<family>`.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-It.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/SourceSerif4-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-SemiboldIt.ttf
          weight: 600
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
